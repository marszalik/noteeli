[project]
name = "noteeli"
version = "1.5.7"
description = "A simple web-based Markdown notebook inspired by Obsidian."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "authlib>=1.3.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "mako>=1.3.5",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
  "mammoth>=1.7.0",
  "openpyxl>=3.1.0",
  "python-pptx>=1.0.0",
  "paramiko>=3.4.0",
  "markdown>=3.5",
  "pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python -m app.run dev"
prod = "python -m app.run prod"
test = "pytest tests/"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
